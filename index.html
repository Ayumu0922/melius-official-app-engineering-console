<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111827'/%3E%3Cpath d='M18 42V20h6v22h-6Zm11 0V14h6v28h-6Zm11 0V26h6v16h-6Z' fill='%23ffffff'/%3E%3Ccircle cx='47' cy='18' r='5' fill='%23ef4444'/%3E%3C/svg%3E" />
    <script>
      (() => {
        const themeKey = 'melius-official-app-engineering-console-theme';
        const languageKey = 'melius-official-app-engineering-console-language';
        const root = document.documentElement;
        const params = new URLSearchParams(window.location.search);
        const requestedLanguage = params.get('locale') || params.get('lang') || params.get('language') || params.get('melius_locale');
        const requestedTheme = params.get('theme') || params.get('themeMode') || params.get('colorScheme') || params.get('melius_theme');
        let language = requestedLanguage === 'ja' || requestedLanguage === 'en' ? requestedLanguage : 'ja';
        let preference = requestedTheme === 'light' || requestedTheme === 'dark' || requestedTheme === 'system' ? requestedTheme : 'system';

        try {
          if (requestedLanguage !== 'ja' && requestedLanguage !== 'en') {
            const storedLanguage = localStorage.getItem(languageKey);
            if (storedLanguage === 'ja' || storedLanguage === 'en') {
              language = storedLanguage;
            }
          }

          if (requestedTheme !== 'light' && requestedTheme !== 'dark' && requestedTheme !== 'system') {
            const storedTheme = localStorage.getItem(themeKey);
            if (storedTheme === 'light' || storedTheme === 'dark' || storedTheme === 'system') {
              preference = storedTheme;
            }
          }
        } catch {
          language = requestedLanguage === 'ja' || requestedLanguage === 'en' ? requestedLanguage : 'ja';
          preference = requestedTheme === 'light' || requestedTheme === 'dark' || requestedTheme === 'system' ? requestedTheme : 'system';
        }

        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolvedTheme = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference;
        root.lang = language;
        root.dataset.theme = resolvedTheme;
        root.dataset.themePreference = preference;
        root.classList.toggle('dark', resolvedTheme === 'dark');
        root.style.colorScheme = resolvedTheme === 'dark' ? 'dark' : 'light';
      })();
    </script>
    <title>Engineering Console Template</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
